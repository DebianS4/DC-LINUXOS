name: Site checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/site-checks.yml"
      - ".github/workflows/pages.yml"

permissions:
  contents: read

concurrency:
  group: site-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build static website
        working-directory: website
        run: sh build.sh
      - name: Test preview server route policy
        run: python3 website/check_preview_server.py
      - name: Verify Pages artifact
        run: |
          test -s website/dist/index.html
          test -s website/dist/styles.css
          test -s website/dist/script.js
          test -s website/dist/favicon.ico
          test -s website/dist/assets/favicon-16x16.png
          test -s website/dist/assets/favicon-32x32.png
          test -s website/dist/assets/apple-touch-icon.png
          test -s website/dist/assets/rpi-zero-hero-v2.webp
          test -s website/dist/assets/rpi-pi45-download-v2.webp
      - name: Verify website security policy and downloads
        run: python3 website/check_security.py website/dist
